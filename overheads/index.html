<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV DataTable with Edit, Copy, and Create Row</title>
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="//cdn.datatables.net/2.1.6/css/dataTables.dataTables.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- DataTables JS -->
    <script src="//cdn.datatables.net/2.1.6/js/dataTables.min.js"></script>
    <!-- jQuery UI for modal -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <style>
        body {
            max-width: 1280px;
        }
        /* Modal Styles */
        #editModal {
            display: none;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 0px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
        }
        .ui-dialog-titlebar-close {
            display: none;
        }
        .modal-content label {
            display: inline-block;
            margin-top: 10px;
            width: 20%;
        }
        .modal-content input,
        .modal-content select {
            width: 60%;
            padding: 5px;
            margin-top: 5px;
            display: inline-block;
        }
        .date-input {
            width: 30%;
            display: inline-block;
            margin-right: 5%;
        }
        #saveEdit, #createNewRow, #clearStorageBtn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .action-buttons button {
            margin-right: 5px;
        }
        #exportBtn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #includeHeaders {
            top: 2em;
            position: relative;
        }
    </style>
</head>
<body>

    <h1>CSV DataTable with Edit, Copy, and Create Row</h1>

    <input type="file" id="csvFileInput" accept=".csv" />
    <table id="csvTable" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Type</th>
                <th>Acc</th>
                <th>NC</th>
                <th>Num</th>
                <th>Date</th>
                <th>Category</th>
                <th>Desc</th>
                <th>Amount</th>
                <th>Code</th>
                <th>VAT</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <!-- Modal for Editing/Creating -->
    <div id="editModal" title="Edit/Create Row">
        <div class="modal-content">
            <label for="editType">Type:</label>
            <select id="editType">
                <option value="BP">BP</option>
                <option value="BR">BR</option>
                <option value="JC">JC</option>
                <option value="JD">JD</option>
            </select><br>

            <label for="editAcc">Acc:</label>
            <input type="text" id="editAcc"><br>

            <label for="editNC">NC:</label>
            <input type="text" id="editNC"><br>

            <label for="editNum">Num:</label>
            <input type="text" id="editNum"><br>

            <label for="editDay">Day:</label>
            <input type="text" id="editDay" class="date-input"><br>

            <label for="editMonth">Month:</label>
            <input type="text" id="editMonth" class="date-input"><br>

            <label for="editYear">Year:</label>
            <input type="text" id="editYear" class="date-input"><br>

            <label for="editCategory">Category:</label>
            <input type="text" id="editCategory"><br>

            <label for="editDesc">Desc:</label>
            <input type="text" id="editDesc"><br>

            <label for="editAmount">Amount:</label>
            <input type="text" id="editAmount" disabled><br> <!-- Disabled -->

            <label for="editCode">Code:</label>
            <select id="editCode">
                <option value="T1">T1</option>
                <option value="T5">T5</option>
                <option value="T9">T9</option>
            </select><br>

            <label for="editVAT">VAT:</label>
            <input type="text" id="editVAT" disabled><br> <!-- Disabled -->

            <label for="editTotal">Total:</label>
            <input type="text" id="editTotal"><br>

            <button id="saveEdit">Save</button>
            <button id="cancelButton">Cancel</button>
        </div>
    </div>

    <h2>Copied Data</h2>
    <button id="createNewRow">Create New Row</button>
    <button id="clearStorageBtn">Clear Table</button>
    <button id="exportBtn">Export to CSV</button>
    <input type="checkbox" id="includeHeaders">Include headers?<input>
    <table id="copiedTable" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Type</th>
                <th>Acc</th>
                <th>NC</th>
                <th>Num</th>
                <th>Date</th>
                <th>Category</th>
                <th>Desc</th>
                <th>Amount</th>
                <th>Code</th>
                <th>VAT</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <div class="totals-section">
        <h3>Totals by Type</h3>
        <p><strong>BP Total:</strong> <span id="totalBP">0.00</span></p>
        <p><strong>BR Total:</strong> <span id="totalBR">0.00</span></p>
        <p><strong>JC Total:</strong> <span id="totalJC">0.00</span></p>
        <p><strong>JD Total:</strong> <span id="totalJD">0.00</span></p>
    </div>

    <script>
        $(document).ready(function() {
            const STORAGE_KEY = 'ctsvs_overheads';
            const csvTable = $('#csvTable').DataTable({
                "order": [[ 4, "desc" ]], // order by Date column (index 4)
                "columnDefs": [{
                    "targets": -1,
                    "data": null,
                    "defaultContent": "<button class='copy-btn'>Copy</button>"
                }]
            });

            const copiedTable = $('#copiedTable').DataTable({
                "columnDefs": [{
                    "targets": -1,
                    "data": null,
                    "defaultContent": "<div class='action-buttons'><button class='edit-btn'>Edit</button><button class='delete-btn'>Delete</button></div>"
                }]
            });

            // Helper to clean value by removing quotes and trimming whitespace
            function cleanValue(value) {
                return value.replace(/^"|"$/g, '').trim();
            }

            function processDate(dateStr) {
                const parts = dateStr.split("/");
                return `${parts[2]}-${parts[1]}-${parts[0]}`; // Convert to yyyy-mm-dd
            }

            function revertDate(dateStr) {
                const parts = dateStr.split("-");
                return `${parts[2]}/${parts[1]}/${parts[0]}`; // Convert back to dd/mm/yyyy
            }

            // Function to save the copied table data to localStorage
            function saveToStorage() {
                const data = copiedTable.rows().data().toArray();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            // Function to load the copied table data from localStorage
            function loadFromStorage() {
                const storedData = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (storedData) {
                    copiedTable.clear();
                    storedData.forEach(row => copiedTable.row.add(row).draw(false));
                    updateTotals();
                }
            }

            // Function to clear localStorage and the copied table
            function clearStorage() {
                localStorage.removeItem(STORAGE_KEY);
                copiedTable.clear().draw();
                updateTotals();
            }

            function updateTotals() {
                let totalBP = 0;
                let totalBR = 0;
                let totalJC = 0;
                let totalJD = 0;

                copiedTable.rows().data().toArray().forEach(row => {
                    const type = row[0];
                    const amount = parseFloat(row[7]) || 0;
                    const vat = parseFloat(row[9]) || 0;
                    const total = amount + vat;

                    switch (type) {
                        case 'BP':
                            totalBP += total;
                            break;
                        case 'BR':
                            totalBR += total;
                            break;
                        case 'JC':
                            totalJC += total;
                            break;
                        case 'JD':
                            totalJD += total;
                            break;
                    }
                });

                // Update the total amounts in the UI
                $('#totalBP').text(totalBP.toFixed(2));
                $('#totalBR').text(totalBR.toFixed(2));
                $('#totalJC').text(totalJC.toFixed(2));
                $('#totalJD').text(totalJD.toFixed(2));
            }

            function processData(data) {
                const lines = data.split("\n").filter(line => line.trim() !== ""); // Remove empty lines
                lines.forEach(line => {
                    let row = line.split(",").map(col => cleanValue(col)); // Clean each column

                    if (row[1] === '1215') { // Filter rows where column 2 (Acc) is '1215'
                        const filteredRow = [
                            row[0],     // Type
                            row[1],     // Acc
                            row[2],     // NC
                            row[3],     // Num
                            processDate(row[4]), // Date
                            row[5],     // Category
                            row[6],     // Desc
                            row[7],     // Amount
                            row[8],     // Code
                            row[9]      // VAT
                        ];
                        csvTable.row.add([...filteredRow, null]).draw(false); // Add row with actions column
                    }
                });
            }

            function readCSV(input) {
                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = function(e) {
                    const text = e.target.result;
                    processData(text);
                };

                reader.readAsText(file);
            }

            $('#csvFileInput').on('change', function() {
                readCSV(this);
            });

            let selectedRowData;
            let editingRowIndex;
            let isCreatingNewRow = false;

            $('#csvTable tbody').on('click', 'button.copy-btn', function () {
                selectedRowData = csvTable.row($(this).parents('tr')).data();
                editingRowIndex = null; // Indicate that we are copying, not editing
                openEditModal(selectedRowData);
            });

            $('#copiedTable tbody').on('click', 'button.edit-btn', function () {
                selectedRowData = copiedTable.row($(this).parents('tr')).data();
                editingRowIndex = copiedTable.row($(this).parents('tr')).index(); // Store the index of the row being edited
                openEditModal(selectedRowData);
            });

            $('#copiedTable tbody').on('click', 'button.delete-btn', function () {
                copiedTable.row($(this).parents('tr')).remove().draw();
                updateTotals(); // Update totals after deletion
                saveToStorage(); // Save table data to localStorage
            });

            $('#createNewRow').on('click', function() {
                isCreatingNewRow = true;
                openEditModal([]); // Open the modal with empty data for a new row
            });

            $('#clearStorageBtn').on('click', function() {
            if (confirm("Are you sure you want to clear the table and delete the data?")) {
                clearStorage(); // Clear storage and empty the table
            }
        });

            function openEditModal(data) {
                if (isCreatingNewRow) {
                    $('#editType').val('BR');
                    $('#editAcc').val('1215');
                    $('#editNC').val('');
                    $('#editNum').val('');
                    $('#editDay').val('');
                    $('#editMonth').val('');
                    $('#editYear').val('');
                    $('#editCategory').val('');
                    $('#editDesc').val('');
                    $('#editAmount').val('');
                    $('#editCode').val('');
                    $('#editVAT').val('');
                    $('#editTotal').val('');
                } else {
                    const dateParts = data[4] ? data[4].split('-') : ['', '', ''];

                    $('#editType').val(data[0]);
                    $('#editAcc').val(data[1]);
                    $('#editNC').val(data[2]);
                    $('#editNum').val(data[3]);
                    $('#editDay').val(dateParts[2]); // Day
                    $('#editMonth').val(dateParts[1]); // Month
                    $('#editYear').val(dateParts[0]); // Year
                    $('#editCategory').val(data[5]);
                    $('#editDesc').val(data[6]);
                    $('#editAmount').val(data[7]);
                    $('#editCode').val(data[8]);
                    $('#editVAT').val(data[9]);
                    $('#editTotal').val((parseFloat(data[7]) + parseFloat(data[9])).toFixed(2));
                }

                $('#editModal').dialog({
                    modal: true,
                    width: 400,
                    closeOnEscape: true,
                    open: function() {
                        $('#editDay').focus(); // Focus on the Day input
                        $(this).off('keypress').on('keypress', function(e) {
                            if (e.key === "Escape") {
                                $(this).dialog("close");
                                isCreatingNewRow = false;
                            }
                            if (e.key === "Enter") {
                                saveEditData();
                                $(this).dialog("close");
                            }
                        });
                    }
                });
            }

            function saveEditData() {
                const day = $('#editDay').val().padStart(2, '0');
                const month = $('#editMonth').val().padStart(2, '0');
                const year = $('#editYear').val();
                const formattedDate = `${year}-${month}-${day}`;

                const total = parseFloat($('#editTotal').val());
                const code = $('#editCode').val();
                let amount, vat;

                if (code === 'T9') {
                    amount = total;
                    vat = 0;
                } else if (code === 'T1') {
                    amount = total / 1.2;
                    vat = total - amount;
                } else if (code === 'T5') {
                    amount = total / 1.05;
                    vat = total - amount;
                }

                amount = amount.toFixed(2);
                vat = vat.toFixed(2);

                const newRowData = [
                    $('#editType').val(),
                    $('#editAcc').val(),
                    $('#editNC').val(),
                    $('#editNum').val(),
                    formattedDate,
                    $('#editCategory').val(),
                    $('#editDesc').val(),
                    amount,
                    $('#editCode').val(),
                    vat
                ];

                if (isCreatingNewRow) {
                    // Add a new row to the copied table
                    copiedTable.row.add([...newRowData, null]).draw(false);
                    isCreatingNewRow = false;
                } else if (editingRowIndex !== null) {
                    // Update the row in the copied table
                    copiedTable.row(editingRowIndex).data([...newRowData, null]).draw(false);
                } else {
                    // Add a new row to the copied table
                    copiedTable.row.add([...newRowData, null]).draw(false);
                }

                $('#editModal').dialog("close");
                updateTotals(); // Update totals after saving
                saveToStorage(); // Save table data to localStorage
            }

            $('#saveEdit').on('click', function() {
                saveEditData();
            });
            $('#cancelButton').on('click', function() {
                $('#editModal').dialog("close");
                isCreatingNewRow = false;
            });

            $('#exportBtn').on('click', function() {
                const data = copiedTable.rows().data().toArray();
                const csv = [];
                if ($('#includeHeaders').is(':checked')) {
                    csv.push("Type,Acc,NC,Num,Date,Category,Desc,Amount,Code,VAT"); // Add header
                }

                data.forEach(row => {
                    // Create a clone of the row to avoid modifying the original data
                    const clonedRow = [...row];

                    // Revert the date format back to dd/mm/yyyy
                    clonedRow[4] = revertDate(clonedRow[4]);

                    // Join the first 10 elements (exclude actions column)
                    csv.push(clonedRow.slice(0, 10).join(","));
                });

                const csvString = csv.join("\n");
                const blob = new Blob([csvString], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('hidden', '');
                a.setAttribute('href', url);
                a.setAttribute('download', 'copied_table_data.csv');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });

            loadFromStorage();
        });
    </script>

</body>
</html>
